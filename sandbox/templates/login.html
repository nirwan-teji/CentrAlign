<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CentrAlign ERP — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { font-size: 3rem; margin-bottom: 8px; }
    .logo h1 { color: #fff; font-size: 1.5rem; font-weight: 700; }
    .logo p { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-top: 4px; }
    label { display: block; color: rgba(255,255,255,0.7); font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: #fff; font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus { border-color: #6c63ff; box-shadow: 0 0 0 3px rgba(108,99,255,0.25); }
    .field { margin-bottom: 20px; }
    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      border: none; border-radius: 10px; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .error {
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5; border-radius: 10px; padding: 12px 16px;
      font-size: 0.875rem; margin-bottom: 20px;
    }
    .hint { text-align: center; color: rgba(255,255,255,0.35); font-size: 0.78rem; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🏢</div>
      <h1>CentrAlign ERP</h1>
      <p>Enterprise Resource Portal</p>
    </div>
    {% if error %}
    <div class="error" id="login-error">⚠ {{ error }}</div>
    {% endif %}
    <form method="POST" action="/login" id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button id="login-btn" class="btn" type="submit">Sign In →</button>
    </form>
    <p class="hint">Demo credentials: admin / admin123</p>
  </div>
</body>
</html>
